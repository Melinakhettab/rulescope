<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuleScope — Impact Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f5f2ea;
  --paper:    #fffdf7;
  --ink:      #14202e;
  --muted:    #6b6557;
  --line:     #ddd7c9;
  --line2:    #ebe5d8;
  --critical: #c8272d;
  --high:     #e8742a;
  --medium:   #e0a817;
  --low:      #2e9e6b;
  --unaffected: #d9d3c4;
  --ff-serif: 'Fraunces', Georgia, serif;
  --ff-sans:  'Plus Jakarta Sans', system-ui, sans-serif;
  --ff-mono:  'JetBrains Mono', monospace;
}

body {
  background: var(--bg);
  font-family: var(--ff-sans);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
}

/* ── TOP BAR ────────────────────────────────────────────── */
#topbar {
  height: 64px;
  padding: 0 64px;
  display: flex;
  align-items: center;
  gap: 32px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
  flex-shrink: 0;
}
/* search widget */
#search-wrap {
  position: relative;
  flex: 1;
  max-width: 420px;
}
#search-input {
  width: 100%;
  height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  font-family: var(--ff-sans);
  font-size: 14px;
  color: var(--ink);
  outline: none;
}
#search-input:focus {
  border-color: var(--ink);
}
#search-input::placeholder {
  color: var(--muted);
}
#search-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: 0 4px 12px rgba(20,32,46,.10);
  z-index: 200;
  overflow: hidden;
}
#search-dropdown.open { display: block; }
.dd-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--line2);
}
.dd-row:last-child { border-bottom: none; }
.dd-row:hover,
.dd-row.focused {
  background: var(--line2);
}
.dd-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dd-dot.critical { background: var(--critical); }
.dd-dot.high     { background: var(--high); }
.dd-dot.medium   { background: var(--medium); }
.dd-dot.low      { background: var(--low); }
.dd-id {
  font-family: var(--ff-mono);
  font-size: 13px;
  flex-shrink: 0;
}
.dd-title {
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.dd-none {
  padding: 10px 14px;
  font-size: 13px;
  color: var(--muted);
}

/* ── MAIN LAYOUT ─────────────────────────────────────────── */
#main {
  padding: 48px 64px 72px;
  display: flex;
  flex-direction: column;
  gap: 64px;
  max-width: 1440px;
}

/* ── SECTION 1: TICKET + SUMMARY ─────────────────────────── */
#sec-request {
  display: grid;
  grid-template-columns: 1fr 520px;
  gap: 56px;
  align-items: start;
}
.section-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 16px;
}
.ticket-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-shadow: 6px 6px 0 #e9e3d4;
}
.ticket-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--ff-mono);
  font-size: 12.5px;
  color: var(--muted);
}
.ticket-title {
  font-family: var(--ff-serif);
  font-size: 28px;
  line-height: 1.32;
  font-weight: 400;
}
.ticket-title mark {
  background: #ffe7a3;
  color: inherit;
  padding: 0 3px;
}
.ticket-summary {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--muted);
}

.glance-table {
  border-top: 2px solid var(--ink);
  display: flex;
  flex-direction: column;
}
.glance-row {
  display: grid;
  grid-template-columns: 160px 1fr;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  align-items: start;
  min-width: 0;
}
.glance-row:last-child { border-bottom: none; }
.glance-key {
  font-size: 13.5px;
  color: var(--muted);
  padding-top: 6px; /* visual alignment against baseline of first child */
}
.glance-val {
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.glance-big {
  font-family: var(--ff-serif);
  font-size: 30px;
  font-weight: 600;
}
.glance-sub {
  font-size: 13.5px;
  color: var(--muted);
}
.glance-big.critical { color: var(--critical); }
.glance-big.high     { color: var(--high); }
.glance-big.medium   { color: var(--medium); }
.glance-big.low      { color: var(--low); }
.glance-blocked {
  font-size: 15px;
  overflow-wrap: anywhere;
  min-width: 0;
}
.glance-blocked .blocking-label {
  color: var(--critical);
  font-weight: 600;
}
/* ── SECTION 2: VERDICT ──────────────────────────────────── */
#sec-verdict {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 1100px;
}
.verdict-text {
  font-family: var(--ff-serif);
  font-size: 46px;
  line-height: 1.2;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.verdict-text .u-high     { text-decoration: underline; text-decoration-color: var(--high);     text-decoration-thickness: 5px; text-underline-offset: 8px; }
.verdict-text .u-critical { text-decoration: underline; text-decoration-color: var(--critical); text-decoration-thickness: 5px; text-underline-offset: 8px; }
.verdict-text .u-medium   { text-decoration: underline; text-decoration-color: var(--medium);   text-decoration-thickness: 5px; text-underline-offset: 8px; }
.verdict-text .u-low      { text-decoration: underline; text-decoration-color: var(--low);      text-decoration-thickness: 5px; text-underline-offset: 8px; }

/* ── SECTION 3: OPEN QUESTIONS ───────────────────────────── */
#sec-questions {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 32px 36px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 5px solid var(--critical);
  border-radius: 4px;
}
.questions-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.questions-title {
  font-family: var(--ff-serif);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.questions-count {
  font-size: 13.5px;
  color: var(--muted);
}
.questions-list {
  display: flex;
  flex-direction: column;
}
.q-row {
  display: grid;
  grid-template-columns: 36px 150px 1fr;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line2);
  align-items: baseline;
}
.q-row:last-child { border-bottom: none; }
.q-num {
  font-family: var(--ff-mono);
  font-size: 13px;
  font-weight: 500;
}
.q-num.blocking { color: var(--critical); }
.q-num.normal   { color: var(--muted); }
.q-tag {
  font-size: 14px;
  font-weight: 600;
}
.q-tag.blocking { color: var(--critical); }
.q-text {
  font-size: 15px;
  line-height: 1.55;
}

/* ── SECTION 4: WHERE IT LANDS ───────────────────────────── */
#sec-map {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.section-heading-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.section-heading {
  font-family: var(--ff-serif);
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.legend {
  display: flex;
  gap: 18px;
  font-size: 12.5px;
  color: var(--muted);
}
.legend-item {
  display: flex;
  gap: 6px;
  align-items: center;
}
.legend-swatch {
  width: 10px;
  height: 10px;
}
.legend-swatch.critical   { background: var(--critical); }
.legend-swatch.high       { background: var(--high); }
.legend-swatch.medium     { background: var(--medium); }
.legend-swatch.low        { background: var(--low); }
.legend-swatch.to-check   { border: 1.5px dashed var(--muted); }
.legend-swatch.unaffected { background: var(--unaffected); }

.map-and-list {
  display: grid;
  grid-template-columns: 1fr 560px;
  gap: 40px;
  align-items: start;
}
/* SVG map container */
.repo-map {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
}

/* File list */
.file-list-table {
  display: flex;
  flex-direction: column;
}
.fl-header {
  display: grid;
  grid-template-columns: 6px 1fr 90px;
  gap: 14px;
  padding: 0 0 10px;
  border-bottom: 2px solid var(--ink);
  font-size: 12.5px;
  color: var(--muted);
}
.fl-row {
  display: grid;
  grid-template-columns: 6px 1fr 90px;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  align-items: start;
}
.fl-row.check {
  grid-template-columns: 6px 1fr;
}
.fl-bar {
  align-self: stretch;
  min-height: 40px;
}
.fl-bar.critical   { background: var(--critical); }
.fl-bar.high       { background: var(--high); }
.fl-bar.medium     { background: var(--medium); }
.fl-bar.low        { background: var(--low); }
.fl-bar.to-check   { border: 1.5px dashed var(--muted); min-height: 20px; }
.fl-bar.unaffected { background: var(--unaffected); }
.fl-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.fl-path {
  font-family: var(--ff-mono);
  font-size: 13px;
}
.fl-desc {
  font-size: 13px;
  color: var(--muted);
}
.fl-lines {
  font-family: var(--ff-mono);
  font-size: 13px;
  text-align: right;
}
.fl-subheader {
  display: grid;
  grid-template-columns: 6px 1fr 90px;
  gap: 14px;
  padding: 22px 0 10px;
  border-bottom: 2px solid var(--ink);
  font-size: 12.5px;
  color: var(--muted);
}

/* ── SECTION 5: THE PROOF ────────────────────────────────── */
#sec-proof {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.proof-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.proof-note {
  font-size: 13.5px;
  color: var(--muted);
}
.proof-grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 48px;
}
.diff-block {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.diff-box {
  background: var(--ink);
  border-radius: 4px;
  padding: 20px 22px;
  font-family: var(--ff-mono);
  font-size: 13px;
  line-height: 1.9;
  color: #c9d3de;
}
.diff-file {
  color: #7f8fa3;
  margin-bottom: 6px;
}
.diff-del { color: #ff9d86; }
.diff-add { color: #7fdcb5; }
.diff-caption {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--muted);
}
.proof-table-wrap {
  display: flex;
  flex-direction: column;
}
.pt-header {
  display: grid;
  grid-template-columns: 6px 180px 76px 76px 1fr;
  gap: 18px;
  padding: 0 0 10px;
  border-bottom: 2px solid var(--ink);
  font-size: 12.5px;
  color: var(--muted);
}
.pt-row {
  display: grid;
  grid-template-columns: 6px 180px 76px 76px 1fr;
  gap: 18px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
  align-items: center;
  font-size: 14px;
}
.pt-row:last-child { border-bottom: none; }
.pt-bar {
  height: 34px;
}
.pt-bar.critical   { background: var(--critical); }
.pt-bar.high       { background: var(--high); }
.pt-bar.medium     { background: var(--medium); }
.pt-bar.low        { background: var(--low); }
.pt-bar.unaffected { background: var(--unaffected); }
.pt-fn {
  font-family: var(--ff-mono);
  font-size: 13px;
}
.pt-pass  { color: #2e7d57; }
.pt-fail  { color: var(--critical); font-weight: 600; }
.pt-muted { color: var(--muted); }

/* ── SECTION 6: THE PLAN ─────────────────────────────────── */
#sec-plan {
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.plan-note {
  font-size: 13.5px;
  color: var(--muted);
}
/* vertical timeline */
.plan-list {
  display: flex;
  flex-direction: column;
}
.plan-step {
  display: grid;
  grid-template-columns: 40px 1fr 280px;
  gap: 0 24px;
  align-items: start;
  min-width: 0;
}
.plan-step-spine {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 0;
  flex-shrink: 0;
}
.plan-dot {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  flex-shrink: 0;
  z-index: 1;
}
.plan-dot.normal   { background: var(--bg); border: 2px solid var(--ink); }
.plan-dot.blocking { background: var(--critical); }
.plan-connector {
  width: 2px;
  flex: 1;
  min-height: 24px;
  background: var(--ink);
  margin-top: 0;
}
.plan-step:last-child .plan-connector { display: none; }
.plan-step-body {
  padding: 0 0 32px;
  min-width: 0;
}
.plan-step-num {
  font-family: var(--ff-mono);
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  line-height: 24px; /* align with dot */
}
.plan-step-num.blocking { color: var(--critical); font-weight: 500; }
.plan-step-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 4px;
  overflow-wrap: anywhere;
}
.plan-step-rest {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.plan-step-right {
  padding: 0 0 32px;
  min-width: 0;
}
.plan-step-files {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.plan-file-chip {
  font-family: var(--ff-mono);
  font-size: 12px;
  color: var(--muted);
  background: var(--line2);
  padding: 2px 7px;
  border-radius: 3px;
  overflow-wrap: anywhere;
  word-break: break-all;
}
.plan-step-rationale {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
  overflow-wrap: anywhere;
}

/* ── OVERFLOW GUARDS (global) ────────────────────────────── */
.fl-path, .fl-desc, .fl-lines,
.pt-fn,
.diff-file, .diff-del, .diff-add,
.entry-route, .entry-sub {
  overflow-wrap: anywhere;
  word-break: break-all;
  min-width: 0;
}
.fl-row, .fl-header, .fl-subheader,
.pt-row, .pt-header,
.proof-grid,
.diff-block,
.proof-table-wrap {
  min-width: 0;
}
.fl-info { min-width: 0; }

/* ── SECTION 7: DETAILS ──────────────────────────────────── */
#sec-details {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 48px;
  padding-top: 36px;
  border-top: 2px solid var(--ink);
}
.detail-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.detail-label {
  font-size: 13px;
  font-weight: 600;
}
.detail-text {
  font-size: 14px;
  line-height: 1.6;
}
.detail-entry {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.entry-route {
  font-family: var(--ff-mono);
  font-size: 13px;
}
.entry-sub {
  font-size: 13px;
  color: var(--muted);
}

/* ── LOADING / ERROR ─────────────────────────────────────── */
#state-overlay {
  padding: 80px 64px;
  font-size: 16px;
  color: var(--muted);
}
#state-overlay.err { color: var(--critical); }
</style>
</head>
<body>

<!-- TOP BAR -->
<header id="topbar">
  <span class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
      <circle cx="10" cy="10" r="6.5" stroke="#14202e" stroke-width="2"/>
      <path d="M15 15l5 5" stroke="#14202e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="10" cy="10" r="2" fill="#e8552f"/>
    </svg>
    RuleScope
  </span>
  <div id="search-wrap" role="search">
    <input id="search-input" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search a ticket ID (e.g. TECH-219)" aria-label="Search ticket ID" aria-autocomplete="list" aria-controls="search-dropdown"/>
    <div id="search-dropdown" role="listbox" aria-label="Matching reports"></div>
  </div>
</header>

<!-- STATE OVERLAY (loading / error) -->
<div id="state-overlay" style="display:none"></div>

<!-- MAIN CONTENT -->
<main id="main" style="display:none">

  <!-- 1. TICKET + AT A GLANCE -->
  <section id="sec-request">
    <div>
      <div class="section-label">The request</div>
      <article class="ticket-card">
        <div class="ticket-meta">
          <span id="t-id"></span>
          <span id="t-date"></span>
        </div>
        <p class="ticket-title" id="t-title"></p>
        <p class="ticket-summary" id="t-summary"></p>
      </article>
    </div>
    <div>
      <div class="section-label">At a glance</div>
      <div class="glance-table" id="glance-table"></div>
    </div>
  </section>

  <!-- 2. VERDICT -->
  <section id="sec-verdict">
    <div class="section-label">Verdict</div>
    <p class="verdict-text" id="verdict-text"></p>
  </section>

  <!-- 3. OPEN QUESTIONS -->
  <section id="sec-questions">
    <div class="questions-header">
      <span class="questions-title">Settle these before you write code</span>
      <span class="questions-count" id="q-count"></span>
    </div>
    <div class="questions-list" id="questions-list"></div>
  </section>

  <!-- 4. WHERE IT LANDS -->
  <section id="sec-map">
    <div class="section-heading-row">
      <span class="section-heading">Where it lands</span>
      <span class="legend">
        <span class="legend-item"><span class="legend-swatch critical"></span>critical</span>
        <span class="legend-item"><span class="legend-swatch high"></span>high</span>
        <span class="legend-item"><span class="legend-swatch medium"></span>medium</span>
        <span class="legend-item"><span class="legend-swatch low"></span>low</span>
        <span class="legend-item"><span class="legend-swatch to-check"></span>to check</span>
        <span class="legend-item"><span class="legend-swatch unaffected"></span>unaffected</span>
      </span>
    </div>
    <div class="map-and-list">
      <div id="repo-map-container"></div>
      <div class="file-list-table" id="file-list-table"></div>
    </div>
  </section>

  <!-- 5. THE PROOF -->
  <section id="sec-proof">
    <div class="proof-header-row">
      <span class="section-heading">The proof</span>
      <span class="proof-note" id="proof-note"></span>
    </div>
    <div id="proof-content"></div>
  </section>

  <!-- 6. THE SAFE WAY THROUGH -->
  <section id="sec-plan">
    <div class="section-heading-row">
      <span class="section-heading">The safe way through</span>
      <span class="plan-note" id="plan-note"></span>
    </div>
    <div id="plan-content"></div>
  </section>

  <!-- 7. DETAILS -->
  <section id="sec-details">
    <div class="detail-col">
      <span class="detail-label">Entry points touched</span>
      <div id="detail-entries"></div>
    </div>
    <div class="detail-col">
      <span class="detail-label">Test coverage</span>
      <div class="detail-text" id="detail-coverage"></div>
    </div>
    <div class="detail-col">
      <span class="detail-label">Checked and left alone</span>
      <p class="detail-text" id="detail-safe"></p>
    </div>
  </section>

</main>

<script>
'use strict';

/* ── helpers ─────────────────────────────────────────────── */
function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shortRepo(p) {
  if (!p) return '';
  const parts = p.replace(/\\/g,'/').split('/');
  return parts[parts.length - 1] || parts[parts.length - 2] || p;
}
function shortFile(f) {
  if (!f) return '';
  return f.replace(/\\/g,'/').split('/').pop() || f;
}
function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  } catch(e) { return iso; }
}
function riskColor(level) {
  return { critical:'critical', high:'high', medium:'medium', low:'low' }[level] || 'muted';
}

/* ── severity derivation ─────────────────────────────────── */
function deriveItemSeverity(item, data) {
  if (item.severity) return item.severity;
  // contradiction on regulatory/compliance → critical
  if (item.issues && item.issues.some(i =>
    i.kind === 'contradiction' &&
    /compliance|regulatory|aml|legal/i.test(i.description || '')
  )) return 'critical';
  const file = (item.evidence || []).map(e => e.file)[0] || '';
  // in filesToChange across any repo → high
  for (const repo of Object.values(data.filesToChange || {})) {
    if (repo.includes(file)) return 'high';
  }
  // in filesToCheck → to-check
  for (const repo of Object.values(data.filesToCheck || {})) {
    if (repo.includes(file)) return 'to-check';
  }
  return 'unaffected';
}

/* ── build the SVG repo map ──────────────────────────────── */
function buildRepoMap(data) {
  const repos = data.repoPaths || [];
  if (!repos.length) return '';

  const BLOCK_H = 50, BLOCK_GAP = 6, LABEL_H = 36, GROUP_GAP = 20;
  const W = 752;
  const PAD = 28;

  // Collect per-repo file groups
  function getGroups(repoPath) {
    const change = (data.filesToChange  || {})[repoPath] || [];
    const check  = (data.filesToCheck   || {})[repoPath] || [];
    const safe   = (data.filesNotAffected || {})[repoPath] || [];
    return { change, check, safe };
  }

  const n = repos.length;
  const laneW = Math.floor((W - PAD * 2 - (n - 1) * 16) / n);
  let svgParts = [];
  let maxH = 40;

  repos.forEach((repo, ri) => {
    const x0 = PAD + ri * (laneW + 16);
    const repoName = shortRepo(repo);
    const { change, check, safe } = getGroups(repo);

    let y = 40;

    // Repo name
    svgParts.push(`<text x="${x0}" y="${y}" font-family="JetBrains Mono" font-size="13.5" font-weight="500" fill="#14202e">${esc(repoName)}</text>`);
    y += 10;

    // Divider between lanes
    if (ri > 0) {
      svgParts.push(`<line x1="${x0 - 8}" y1="24" x2="${x0 - 8}" y2="9999" stroke="#ddd7c9" stroke-width="1" id="vdiv${ri}"/>`);
    }

    function renderFiles(files, cls, labelText) {
      if (!files.length) return;
      y += GROUP_GAP;
      if (labelText) {
        svgParts.push(`<text x="${x0}" y="${y}" font-family="JetBrains Mono" font-size="11" fill="#6b6557">${esc(labelText)}</text>`);
        y += 14;
      }
      const maxCols = Math.max(1, Math.floor(laneW / 130));
      let col = 0, rowY = y;
      const colW = Math.floor((laneW - (maxCols - 1) * BLOCK_GAP) / maxCols);

      files.forEach(f => {
        const bx = x0 + col * (colW + BLOCK_GAP);
        const by = rowY;
        const fname = shortFile(f);

        // Severity per file
        let sev = cls;
        if (cls === 'change') {
          // derive severity from items
          let found = 'high';
          for (const item of (data.items || [])) {
            const itemFiles = (item.evidence || []).map(e => e.file);
            if (itemFiles.includes(f)) {
              found = deriveItemSeverity(item, data);
              break;
            }
          }
          sev = found;
        }

        const fillColor = {
          critical:   '#c8272d',
          high:       '#e8742a',
          medium:     '#e0a817',
          low:        '#2e9e6b',
          unaffected: '#d9d3c4',
          'to-check': null,
        }[sev] || '#d9d3c4';
        const textColor = ['critical','high'].includes(sev) ? '#ffffff' : '#14202e';

        if (sev === 'to-check') {
          svgParts.push(`<rect x="${bx}" y="${by}" width="${colW}" height="${BLOCK_H}" fill="none" stroke="#6b6557" stroke-width="1.5" stroke-dasharray="4 3"/>`);
        } else {
          svgParts.push(`<rect x="${bx}" y="${by}" width="${colW}" height="${BLOCK_H}" fill="${fillColor}"/>`);
        }
        // filename text (truncated visually)
        svgParts.push(`<text x="${bx + 10}" y="${by + 30}" font-family="JetBrains Mono" font-size="11" fill="${textColor}">${esc(fname.length > 16 ? fname.slice(0,14)+'…' : fname)}</text>`);

        col++;
        if (col >= maxCols) {
          col = 0;
          rowY += BLOCK_H + BLOCK_GAP;
        }
      });
      const rows = Math.ceil(files.length / maxCols);
      y = rowY + (col === 0 ? 0 : BLOCK_H + BLOCK_GAP);
    }

    const totalFiles = change.length + check.length + safe.length;
    if (totalFiles === 0) {
      y += GROUP_GAP;
      svgParts.push(`<text x="${x0}" y="${y + 18}" font-family="Plus Jakarta Sans" font-size="12" fill="#6b6557">entirely unaffected</text>`);
      y += 36;
    } else {
      renderFiles(change, 'change', change.length ? 'to change' : null);
      renderFiles(check,  'to-check', check.length  ? 'to check'  : null);
      renderFiles(safe,   'unaffected', safe.length  ? 'other files' : null);
    }

    if (y + 24 > maxH) maxH = y + 24;
  });

  // Fix up the vertical divider heights now we know maxH
  const svgStr = svgParts.join('\n');
  const fixedSvg = svgStr.replace(/y2="9999"/g, `y2="${maxH}"`);

  return `<svg width="${W}" height="${maxH}" viewBox="0 0 ${W} ${maxH}" role="img"
    style="display:block;background:#fffdf7;border:1px solid #ddd7c9;border-radius:4px"
    aria-label="Repository map">${fixedSvg}</svg>`;
}

/* ── build file list (right column of sec 4) ─────────────── */
function buildFileList(data) {
  const repos = data.repoPaths || [];
  let html = '';

  let hasChange = false, hasCheck = false;
  repos.forEach(repo => {
    const change = (data.filesToChange  || {})[repo] || [];
    const check  = (data.filesToCheck   || {})[repo] || [];
    if (change.length) hasChange = true;
    if (check.length)  hasCheck  = true;
  });

  if (hasChange) {
    let repoLabel = '';
    repos.forEach(repo => {
      const change = (data.filesToChange || {})[repo] || [];
      if (!change.length) return;
      const rname = shortRepo(repo);
      if (rname !== repoLabel) {
        html += `<div class="fl-header"><span></span><span>Change — ${esc(rname)}</span><span style="text-align:right">Lines</span></div>`;
        repoLabel = rname;
      }
      change.forEach(f => {
        // find item for this file
        let sev = 'high';
        let desc = '';
        let lines = '';
        for (const item of (data.items || [])) {
          const evFiles = (item.evidence || []).map(e => e.file);
          if (evFiles.includes(f)) {
            sev = deriveItemSeverity(item, data);
            desc = item.description || item.label || '';
            // find line range
            const evLines = (item.evidence || []).map(e => e.line).filter(Boolean);
            if (evLines.length >= 2) {
              lines = `${Math.min(...evLines)}–${Math.max(...evLines)}`;
            } else if (evLines.length === 1) {
              lines = `${evLines[0]}`;
            }
            break;
          }
        }
        if (!desc) {
          // derive from label
          for (const item of (data.items || [])) {
            if ((item.label||'').toLowerCase().includes(shortFile(f).replace('.ts','').toLowerCase())) {
              sev = deriveItemSeverity(item, data);
              desc = item.description || item.label || '';
              const evLines = (item.evidence||[]).map(e=>e.line).filter(Boolean);
              if (evLines.length >= 2) lines = `${Math.min(...evLines)}–${Math.max(...evLines)}`;
              else if (evLines.length === 1) lines = `${evLines[0]}`;
              break;
            }
          }
        }
        html += `<div class="fl-row">
          <span class="fl-bar ${sev}"></span>
          <span class="fl-info">
            <span class="fl-path">${esc(f)}</span>
            ${desc ? `<span class="fl-desc">${esc(desc.length > 80 ? desc.slice(0,78)+'…' : desc)}</span>` : ''}
          </span>
          <span class="fl-lines">${esc(lines)}</span>
        </div>`;
      });
    });
  }

  if (hasCheck) {
    html += `<div class="fl-subheader"><span></span><span>Check</span><span></span></div>`;
    repos.forEach(repo => {
      const check = (data.filesToCheck || {})[repo] || [];
      check.forEach(f => {
        html += `<div class="fl-row check">
          <span class="fl-bar to-check"></span>
          <span class="fl-info"><span class="fl-path">${esc(f)}</span></span>
        </div>`;
      });
    });
  }

  return html;
}

/* ── build verdict ───────────────────────────────────────── */
function buildVerdict(data) {
  // Pick worst simulation (most failures)
  const sims = (data.simulations || []).filter(s => s.rows && s.rows.length);
  if (!sims.length) return '';

  // Find simulation with most failures (the "naive" one)
  let worst = sims[0];
  let mostFails = 0;
  sims.forEach(s => {
    const fails = s.rows.filter(r => !r.passed).length;
    if (fails > mostFails) { mostFails = fails; worst = s; }
  });

  const total = worst.rows.length;
  const fails = worst.rows.filter(r => !r.passed).length;
  const riskLvl = data.riskLevel || 'high';
  const uc = {critical:'.u-critical',high:'.u-high',medium:'.u-medium',low:'.u-low'}[riskLvl] || '.u-high';
  const cls = uc.slice(1);

  // Check for regulatory/compliance issues
  let hasRegulatory = (data.items || []).some(item =>
    (item.issues || []).some(i =>
      i.kind === 'contradiction' &&
      /compliance|regulatory|aml|legal/i.test(i.description || '')
    )
  );

  // Count files to change
  let totalChange = 0;
  for (const fs of Object.values(data.filesToChange || {})) totalChange += fs.length;

  if (fails === 0) {
    return `<span>All ${total} simulated calls pass after the change — but verify the files to check manually.</span>`;
  }

  let sentence = `Replacing one ${riskLvl === 'low' ? 'style value' : 'function'} breaks `;
  sentence += `<span class="${cls} u-${riskLvl}">${fails} of ${total} calls</span>`;
  if (hasRegulatory) {
    sentence += ` — including the <span class="u-critical">regulatory compliance query</span>`;
  }
  sentence += `. All ${totalChange > 0 ? totalChange : 'impacted'} must change together.`;

  return sentence;
}

/* ── build open questions ────────────────────────────────── */
function buildQuestions(data) {
  const qs = data.openQuestions || [];
  if (!qs.length) return null;

  const BLOCKING_RE = /compliance|legal|regulatory|sign.?off|blocking/i;
  let blockCount = 0;
  let html = '';

  qs.forEach((q, i) => {
    const isBlocking = BLOCKING_RE.test(q);
    if (isBlocking) blockCount++;
    const num = String(i + 1).padStart(2, '0');
    const tag = isBlocking ? 'Compliance · blocking' : 'Platform';
    html += `<div class="q-row">
      <span class="q-num ${isBlocking ? 'blocking' : 'normal'}">${esc(num)}</span>
      <span class="q-tag ${isBlocking ? 'blocking' : ''}">${esc(tag)}</span>
      <span class="q-text">${esc(q)}</span>
    </div>`;
  });

  const countLabel = `${qs.length} open question${qs.length !== 1 ? 's' : ''}${blockCount ? ' · ' + blockCount + ' blocking' : ''}`;
  return { html, countLabel, hasBlocking: blockCount > 0 };
}

/* ── build proof section ─────────────────────────────────── */
function buildProof(data) {
  const sims = (data.simulations || []).filter(s => s.rows && s.rows.length);
  if (!sims.length) return '';

  // Pick the simulation with real edits (the "naive change" one)
  let sim = sims.find(s => s.edits && s.edits.length) || sims[sims.length - 1];

  // Diff display
  let diffHtml = '';
  const edits = sim.edits || [];
  if (edits.length) {
    const edit = edits[0];
    diffHtml = `<div class="diff-box">
      <div class="diff-file">${esc(edit.file)}</div>
      <div class="diff-del">− ${esc(edit.search.trim())}</div>
      <div class="diff-add">+ ${esc(edit.replace.trim())}</div>
    </div>`;
  } else {
    diffHtml = `<div class="diff-box"><div class="diff-file">${esc(shortRepo(sim.repoPath))}</div><div style="color:#7f8fa3">${esc(sim.testCode || 'Proof-only run')}</div></div>`;
  }

  // Table rows
  let tableRows = '';
  sim.rows.forEach(row => {
    const sev = row.passed ? 'unaffected' : (row.input.toLowerCase().includes('aml') || row.input.toLowerCase().includes('compliance') ? 'critical' : 'high');
    const beforeText = typeof row.before === 'string' ? row.before : (row.passed ? 'passes' : 'passes');
    const afterText  = typeof row.after  === 'string' ? row.after  : (row.passed ? 'passes' : 'fails');

    // parse function name from input
    const fnMatch = row.input.match(/^(\w+)/);
    const fnName = fnMatch ? fnMatch[1] : row.input.slice(0, 20);

    // consequence
    const consequence = row.passed
      ? `<span class="pt-muted">${esc(row.input)}</span>`
      : `${esc(row.input)}`;

    const passCls  = (s) => /pass/i.test(s) ? 'pt-pass' : 'pt-fail';
    tableRows += `<div class="pt-row">
      <span class="pt-bar ${sev}"></span>
      <span class="pt-fn">${esc(fnName)}</span>
      <span class="${passCls(beforeText)}">${esc(beforeText.replace(/✅|❌/g,'').trim())}</span>
      <span class="${passCls(afterText)}">${esc(afterText.replace(/✅|❌/g,'').trim())}</span>
      <span>${consequence}</span>
    </div>`;
  });

  return `<div class="proof-grid">
    <div class="diff-block">
      ${diffHtml}
      <p class="diff-caption">${esc(sim.testCode || 'Simulated in a temporary copy with vitest — the real code was never touched')}</p>
    </div>
    <div class="proof-table-wrap">
      <div class="pt-header"><span></span><span>Call</span><span>Before</span><span>After</span><span>Consequence</span></div>
      ${tableRows}
    </div>
  </div>`;
}

/* ── build change plan ───────────────────────────────────── */
function buildPlan(data) {
  const steps = (data.changePlan || []).sort((a,b) => a.order - b.order);
  if (!steps.length) return '';

  const BLOCK_RE = /sign.?off|compliance|legal|regulatory/i;

  const stepsHtml = steps.map((step, i) => {
    const isBlocking = BLOCK_RE.test(step.action || '');
    const numLabel = String(i + 1).padStart(2, '0') + (isBlocking ? ' · blocking' : '');
    const action = step.action || '';

    // Split action into bold first sentence + rest
    const splitIdx = action.search(/[.;]/);
    let titlePart, restPart;
    if (splitIdx !== -1 && splitIdx < 100) {
      titlePart = action.slice(0, splitIdx + 1).trim();
      restPart  = action.slice(splitIdx + 1).trim();
    } else if (action.length > 90) {
      // no sentence break found within 100 chars — cut at 90
      titlePart = action.slice(0, 90) + '…';
      restPart  = '';
    } else {
      titlePart = action;
      restPart  = '';
    }

    // Files chips
    const targetFiles = (step.targetFiles || []).filter(Boolean);
    const filesHtml = targetFiles.length
      ? targetFiles.map(f => `<span class="plan-file-chip">${esc(shortFile(f))}</span>`).join('')
      : '';

    const rationale = step.rationale || '';

    return `<div class="plan-step">
      <div class="plan-step-spine">
        <span class="plan-dot ${isBlocking ? 'blocking' : 'normal'}"></span>
        <span class="plan-connector"></span>
      </div>
      <div class="plan-step-body">
        <div class="plan-step-num ${isBlocking ? 'blocking' : ''}">${esc(numLabel)}</div>
        <div class="plan-step-title">${esc(titlePart)}</div>
        ${restPart ? `<div class="plan-step-rest">${esc(restPart)}</div>` : ''}
      </div>
      <div class="plan-step-right">
        ${filesHtml ? `<div class="plan-step-files">${filesHtml}</div>` : ''}
        ${rationale ? `<div class="plan-step-rationale">${esc(rationale)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return `<div class="plan-list">${stepsHtml}</div>`;
}

/* ── build coverage text ─────────────────────────────────── */
function buildCoverageText(data) {
  const covArr = data.coverage || [];
  const uncovered = covArr.flatMap(c => c.uncoveredFiles || []).map(shortFile);
  const hasCovData = covArr.some(c =>
    Object.keys(c.fileCoverage || {}).length > 0 ||
    Object.keys(c.functionCoverage || {}).length > 0
  );
  if (!hasCovData) {
    if (uncovered.length) {
      return `Not measured for this run. Files to review by hand first: ${uncovered.map(f => `<code style="font-family:var(--ff-mono);font-size:13px">${esc(f)}</code>`).join(', ')}.`;
    }
    return 'Not measured for this run.';
  }
  return 'Coverage data is present in the report.';
}

/* ── build details section ───────────────────────────────── */
function buildDetails(data) {
  // Entry points
  const eps = data.entryPoints || [];
  let entryHtml = '';
  eps.forEach(ep => {
    entryHtml += `<div class="detail-entry">
      <span class="entry-route">${esc(ep.label)}</span>
      ${ep.description ? `<span class="entry-sub">${esc(ep.description.length > 80 ? ep.description.slice(0,78)+'…' : ep.description)}</span>` : ''}
    </div>`;
  });
  if (!entryHtml) entryHtml = '<span style="color:var(--muted);font-size:13px">None identified</span>';

  // Coverage
  const coverageHtml = buildCoverageText(data);

  // Safe files
  let safeFiles = [];
  for (const fs of Object.values(data.filesNotAffected || {})) safeFiles.push(...fs);
  const safeHtml = safeFiles.length
    ? `${safeFiles.map(shortFile).slice(0, 8).map(esc).join(', ')}${safeFiles.length > 8 ? ` and ${safeFiles.length - 8} more` : ''} — no changes required.`
    : 'No unaffected files listed.';

  return { entryHtml, coverageHtml, safeHtml };
}

/* ── build "at a glance" ─────────────────────────────────── */
function buildGlance(data) {
  const risk = data.riskLevel || 'unknown';
  const riskCls = riskColor(risk);
  const riskLabel = risk.charAt(0).toUpperCase() + risk.slice(1);

  // severity counts from items
  let counts = { critical:0, high:0, medium:0, low:0 };
  (data.items || []).forEach(item => {
    const sev = deriveItemSeverity(item, data);
    if (counts[sev] !== undefined) counts[sev]++;
  });
  const sevParts = Object.entries(counts).filter(([,v])=>v>0).map(([k,v])=>`${v} ${k}`);

  // effort — big serif for text before the first comma, rest in normal body
  const effort = data.effortEstimate || '';
  const commaIdx = effort.indexOf(',');
  const effortHead = commaIdx !== -1 ? effort.slice(0, commaIdx) : effort;
  const effortTail = commaIdx !== -1 ? effort.slice(commaIdx) : '';

  // files counts
  let changeCount = 0, checkCount = 0;
  for (const fs of Object.values(data.filesToChange || {})) changeCount += fs.length;
  for (const fs of Object.values(data.filesToCheck  || {})) checkCount  += fs.length;

  // blocked by
  const blockingQ = (data.openQuestions || []).find(q =>
    /compliance|legal|regulatory|sign.?off|blocking/i.test(q)
  );

  // scanned
  let totalFiles = 0;
  for (const fs of Object.values(data.filesNotAffected || {})) totalFiles += fs.length;
  for (const fs of Object.values(data.filesToChange    || {})) totalFiles += fs.length;
  for (const fs of Object.values(data.filesToCheck     || {})) totalFiles += fs.length;
  const repoCount = (data.repoPaths || []).length;

  let html = `
    <div class="glance-row">
      <span class="glance-key">Risk</span>
      <span class="glance-val">
        <span class="glance-big ${riskCls}">${esc(riskLabel)}</span>
        ${sevParts.length ? `<span class="glance-sub">${esc(sevParts.join(' · '))}</span>` : ''}
      </span>
    </div>
    <div class="glance-row">
      <span class="glance-key">Effort</span>
      <span class="glance-val" style="flex-direction:column;align-items:flex-start;gap:2px">
        <span class="glance-big">${esc(effortHead)}</span>${effortTail ? `<span style="font-size:14px;color:var(--muted);line-height:1.5">${esc(effortTail.replace(/^,\s*/,''))}</span>` : ''}
      </span>
    </div>
    <div class="glance-row">
      <span class="glance-key">Files</span>
      <span class="glance-val">
        <span class="glance-big">
          ${changeCount} <span style="font-size:18px;font-weight:400">to change</span>
          ${checkCount ? ` · ${checkCount} <span style="font-size:18px;font-weight:400">to check</span>` : ''}
        </span>
      </span>
    </div>`;

  if (blockingQ) {
    html += `<div class="glance-row">
      <span class="glance-key">Blocked by</span>
      <span class="glance-blocked"><span class="blocking-label">Compliance sign-off</span> — ${esc(blockingQ)}</span>
    </div>`;
  }

  if (totalFiles > 0 || repoCount > 0) {
    html += `<div class="glance-row">
      <span class="glance-key">Scanned</span>
      <span style="font-size:15px">${totalFiles} files in ${repoCount} repositor${repoCount === 1 ? 'y' : 'ies'}</span>
    </div>`;
  }

  return html;
}

/* ── render a report ─────────────────────────────────────── */
function renderReport(data) {
  // 1. ticket
  const d = new Date(data.createdAt || '');
  const dateStr = data.createdAt
    ? d.toLocaleDateString('en-GB', { day:'numeric', month:'short' })
    : '';

  document.getElementById('t-id').textContent = data.ticketId || '';
  document.getElementById('t-date').textContent = (data.requestedBy ? data.requestedBy + ' · ' : '') + dateStr;
  document.getElementById('t-title').textContent = data.title || '';
  document.getElementById('t-summary').textContent = data.requestSummary || '';
  document.title = `RuleScope — ${data.ticketId || 'Impact Brief'}`;

  // glance
  document.getElementById('glance-table').innerHTML = buildGlance(data);

  // 2. verdict
  const verdictEl = document.getElementById('verdict-text');
  const verdictHtml = buildVerdict(data);
  if (verdictHtml) {
    verdictEl.innerHTML = verdictHtml;
    document.getElementById('sec-verdict').style.display = '';
  } else {
    document.getElementById('sec-verdict').style.display = 'none';
  }

  // 3. questions
  const qResult = buildQuestions(data);
  const secQ = document.getElementById('sec-questions');
  if (qResult) {
    document.getElementById('questions-list').innerHTML = qResult.html;
    document.getElementById('q-count').textContent = qResult.countLabel;
    // border color: red if blocking, else default
    secQ.style.borderLeftColor = qResult.hasBlocking ? 'var(--critical)' : 'var(--line)';
    secQ.style.display = '';
  } else {
    secQ.style.display = 'none';
  }

  // 4. map + file list
  document.getElementById('repo-map-container').innerHTML = buildRepoMap(data);
  document.getElementById('file-list-table').innerHTML = buildFileList(data);

  // 5. proof
  const proofHtml = buildProof(data);
  const secProof = document.getElementById('sec-proof');
  if (proofHtml) {
    document.getElementById('proof-content').innerHTML = proofHtml;
    document.getElementById('proof-note').textContent = 'Simulated in a temporary copy with vitest — the real code was never touched';
    secProof.style.display = '';
  } else {
    secProof.style.display = 'none';
  }

  // 6. plan
  const planHtml = buildPlan(data);
  const secPlan = document.getElementById('sec-plan');
  if (planHtml) {
    document.getElementById('plan-content').innerHTML = planHtml;
    const stepCount = (data.changePlan || []).length;
    document.getElementById('plan-note').textContent = stepCount === 1
      ? 'One step' : `${stepCount} steps, in this order`;
    secPlan.style.display = '';
  } else {
    secPlan.style.display = 'none';
  }

  // 7. details
  const { entryHtml, coverageHtml, safeHtml } = buildDetails(data);
  document.getElementById('detail-entries').innerHTML = entryHtml;
  document.getElementById('detail-coverage').innerHTML = coverageHtml;
  document.getElementById('detail-safe').textContent = safeHtml;

  document.getElementById('state-overlay').style.display = 'none';
  document.getElementById('main').style.display = '';
}

/* ── search widget ───────────────────────────────────────── */
let currentTicketId = null;
let allReports = [];    // [{ticketId, title, riskLevel}]
let ddFocusIdx  = -1;

function openReport(ticketId) {
  history.pushState(null, '', '?report=' + encodeURIComponent(ticketId));
  document.getElementById('search-input').value = ticketId;
  closeDropdown();
  loadReport(ticketId);
}

function closeDropdown() {
  const dd = document.getElementById('search-dropdown');
  dd.classList.remove('open');
  dd.innerHTML = '';
  ddFocusIdx = -1;
}

function renderDropdown(matches, query) {
  const dd = document.getElementById('search-dropdown');
  if (!query) { closeDropdown(); return; }
  dd.innerHTML = '';
  ddFocusIdx = -1;
  if (!matches.length) {
    const none = document.createElement('div');
    none.className = 'dd-none';
    none.textContent = `No report for "${query}"`;
    dd.appendChild(none);
  } else {
    matches.forEach((r, idx) => {
      const row = document.createElement('div');
      row.className = 'dd-row';
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', 'false');
      row.dataset.idx = idx;
      row.innerHTML = `<span class="dd-dot ${riskColor(r.riskLevel)}"></span>` +
                      `<span class="dd-id">${esc(r.ticketId)}</span>` +
                      `<span class="dd-title">${esc(r.title)}</span>`;
      row.addEventListener('mousedown', e => { e.preventDefault(); openReport(r.ticketId); });
      dd.appendChild(row);
    });
  }
  dd.classList.add('open');
}

function setDdFocus(idx) {
  const dd = document.getElementById('search-dropdown');
  const rows = dd.querySelectorAll('.dd-row');
  rows.forEach((r, i) => r.classList.toggle('focused', i === idx));
  ddFocusIdx = idx;
}

function initSearch() {
  const input = document.getElementById('search-input');
  const dd    = document.getElementById('search-dropdown');

  input.addEventListener('input', () => {
    const q = input.value.trim();
    if (!q) { closeDropdown(); return; }
    const ql = q.toLowerCase();
    const matches = allReports.filter(r =>
      r.ticketId.toLowerCase().includes(ql) ||
      (r.title || '').toLowerCase().includes(ql)
    );
    renderDropdown(matches, q);
  });

  input.addEventListener('keydown', e => {
    const dd2 = document.getElementById('search-dropdown');
    const rows = dd2.querySelectorAll('.dd-row');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (!dd2.classList.contains('open')) {
        renderDropdown(allReports, input.value.trim() || ' ');
      }
      setDdFocus(Math.min(ddFocusIdx + 1, rows.length - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setDdFocus(Math.max(ddFocusIdx - 1, 0));
    } else if (e.key === 'Escape') {
      closeDropdown();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (ddFocusIdx >= 0 && rows[ddFocusIdx]) {
        const idx = parseInt(rows[ddFocusIdx].dataset.idx);
        const q = input.value.trim();
        const ql = q.toLowerCase();
        const matches = allReports.filter(r =>
          r.ticketId.toLowerCase().includes(ql) ||
          (r.title || '').toLowerCase().includes(ql)
        );
        if (matches[idx]) openReport(matches[idx].ticketId);
      } else {
        const q = input.value.trim();
        if (q) {
          const exact = allReports.find(r => r.ticketId.toLowerCase() === q.toLowerCase());
          if (exact) openReport(exact.ticketId);
        }
      }
    }
  });

  input.addEventListener('blur', () => {
    // slight delay so mousedown fires first
    setTimeout(closeDropdown, 150);
  });

  input.addEventListener('focus', () => {
    const q = input.value.trim();
    if (q) {
      const ql = q.toLowerCase();
      const matches = allReports.filter(r =>
        r.ticketId.toLowerCase().includes(ql) ||
        (r.title || '').toLowerCase().includes(ql)
      );
      renderDropdown(matches, q);
    }
  });

  // "/" shortcut
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input &&
        !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
}

/* ── load ────────────────────────────────────────────────── */
function showState(msg, isError) {
  const el = document.getElementById('state-overlay');
  el.textContent = msg;
  el.className = isError ? 'err' : '';
  el.style.display = '';
  document.getElementById('main').style.display = 'none';
}

async function loadReport(ticketId) {
  currentTicketId = ticketId;
  showState('Loading…', false);
  try {
    const res = await fetch(`data/${encodeURIComponent(ticketId)}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderReport(data);
  } catch(e) {
    showState(`Could not load report "${ticketId}": ${e.message}`, true);
  }
}

async function init() {
  // Load index
  try {
    const res = await fetch('data/index.json');
    if (res.ok) allReports = await res.json();
  } catch(e) {}

  initSearch();

  const params = new URLSearchParams(location.search);
  const requested = params.get('report');
  const firstId = allReports.length ? allReports[0].ticketId : null;
  const activeId = requested || firstId;

  if (activeId) {
    document.getElementById('search-input').value = activeId;
    loadReport(activeId);
  } else {
    showState('No report specified. Append ?report=<ticketId> to the URL.', false);
  }
}

init();
</script>
