<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuleScope — Impact Brief</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --surface: #f7f8fa;
    --surface2: #eef0f3;
    --border: #d8dbe1;
    --text: #1a1e26;
    --muted: #57606a;
    --accent: #1d4ed8;
    --accent-light: #dbeafe;
    --green: #166534;
    --green-bg: #dcfce7;
    --red: #991b1b;
    --red-bg: #fee2e2;
    --yellow: #854d0e;
    --yellow-bg: #fef9c3;
    --orange: #9a3412;
    --orange-bg: #ffedd5;
    --purple: #5b21b6;
    --purple-bg: #ede9fe;
    --radius: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
  }

  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    padding-bottom: 48px;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  .header {
    background: #0f1724;
    color: #f0f4ff;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 56px;
    border-bottom: 2px solid #1d4ed8;
    flex-wrap: wrap;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .02em;
    color: #e2e8f0;
  }
  .header-brand svg { flex-shrink: 0; }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .header-controls label { color: #94a3b8; font-size: 13px; }
  .header-controls input,
  .header-controls select {
    background: #1e2a3a;
    border: 1px solid #334155;
    color: #e2e8f0;
    border-radius: var(--radius);
    padding: 5px 10px;
    font-size: 13px;
    outline: none;
  }
  .header-controls input:focus,
  .header-controls select:focus { border-color: #3b82f6; }
  .btn-load {
    background: #1d4ed8;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-load:hover { background: #1e40af; }

  /* ── Layout ──────────────────────────────────────────────────────────── */
  .container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ── Report Hero ─────────────────────────────────────────────────────── */
  .report-hero {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .hero-left { flex: 1; min-width: 0; }
  .hero-left .ticket-id { font-size: 12px; color: var(--muted); font-family: monospace; margin-bottom: 2px; }
  .hero-left h1 { font-size: 20px; font-weight: 700; line-height: 1.3; color: var(--text); }
  .hero-left .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hero-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .risk-low    { background: var(--green-bg);  color: var(--green); }
  .risk-medium { background: var(--yellow-bg); color: var(--yellow); }
  .risk-high   { background: var(--orange-bg); color: var(--orange); }
  .risk-critical { background: var(--red-bg); color: var(--red); }

  /* ── Metrics bar ─────────────────────────────────────────────────────── */
  .metrics-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .metric-cell {
    flex: 1;
    min-width: 140px;
    padding: 14px 20px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .metric-cell:last-child { border-right: none; }
  .metric-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .metric-value { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.2; }
  .metric-sub { font-size: 11px; color: var(--muted); }
  .metric-savings { color: var(--green); }
  .progress-row { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
  .progress-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .progress-fill.green { background: #16a34a; }
  .progress-fill.red   { background: #dc2626; }

  /* ── Sections ────────────────────────────────────────────────────────── */
  .sections { padding: 20px 0; }

  details.panel {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    background: var(--bg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  details.panel[open] > summary .chev { transform: rotate(90deg); }

  details.panel > summary {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    list-style: none;
    background: var(--surface);
    border-bottom: 1px solid transparent;
  }
  details.panel[open] > summary { border-bottom-color: var(--border); }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary:hover { background: var(--surface2); }

  .chev {
    width: 16px; height: 16px;
    flex-shrink: 0;
    color: var(--muted);
    transition: transform .15s ease;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-icon { font-size: 15px; }
  .panel-count {
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 10px;
    padding: 1px 7px;
  }
  .panel-body { padding: 16px; }

  /* ── Prose ───────────────────────────────────────────────────────────── */
  .prose { color: var(--text); line-height: 1.7; font-size: 14px; }
  .prose p { margin-bottom: 8px; }
  .prose p:last-child { margin-bottom: 0; }

  /* ── Open questions ──────────────────────────────────────────────────── */
  .questions-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .questions-list li {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--yellow-bg); border: 1px solid #fde68a;
    border-radius: var(--radius); padding: 8px 12px;
    color: var(--text); font-size: 13.5px; line-height: 1.55;
  }
  .questions-list li::before { content: "?"; font-weight: 800; color: var(--yellow); flex-shrink: 0; margin-top: 1px; }

  /* ── Entry points ────────────────────────────────────────────────────── */
  .entry-points-grid { display: flex; flex-direction: column; gap: 8px; }
  .entry-card {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
    background: var(--surface);
  }
  .entry-card-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
  .entry-method {
    font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 3px;
    font-family: monospace; flex-shrink: 0; margin-top: 2px;
    background: #dbeafe; color: #1e40af;
  }
  .entry-label { font-weight: 600; font-size: 13.5px; }
  .entry-repo-badge {
    margin-left: auto; font-size: 11px; color: var(--muted);
    font-family: monospace; white-space: nowrap; padding-top: 3px;
  }
  .entry-desc { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

  /* ── File triage ─────────────────────────────────────────────────────── */
  .repo-block { margin-bottom: 18px; }
  .repo-block:last-child { margin-bottom: 0; }
  .repo-heading {
    font-size: 12px; font-weight: 700; font-family: monospace;
    color: var(--muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .repo-heading::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .triage-group { margin-bottom: 10px; }
  .triage-group:last-child { margin-bottom: 0; }
  .triage-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 8px; border-radius: 3px; display: inline-block; margin-bottom: 6px;
  }
  .triage-change { background: var(--red-bg); color: var(--red); }
  .triage-check  { background: var(--yellow-bg); color: var(--yellow); }
  .triage-safe   { background: var(--green-bg); color: var(--green); }
  .file-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .file-chip {
    font-family: monospace; font-size: 12px; padding: 2px 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); white-space: nowrap;
  }

  /* ── Cross-repo links ────────────────────────────────────────────────── */
  .link-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px; background: var(--surface);
  }
  .link-card:last-child { margin-bottom: 0; }
  .link-flow {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .link-repo-tag {
    font-family: monospace; font-size: 11px; padding: 2px 7px;
    border-radius: 3px; background: var(--purple-bg); color: var(--purple); font-weight: 600;
  }
  .link-arrow { color: var(--muted); font-size: 16px; font-weight: 300; }
  .link-matched {
    font-family: monospace; font-size: 12px; color: var(--accent);
    background: var(--accent-light); padding: 1px 6px; border-radius: 3px;
  }
  .link-desc { font-size: 13px; color: var(--muted); }

  /* ── Impact items ────────────────────────────────────────────────────── */
  .items-grid { display: flex; flex-direction: column; gap: 10px; }
  .item-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden;
  }
  .item-header {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .item-kind {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    padding: 2px 7px; border-radius: 3px; flex-shrink: 0; margin-top: 2px;
  }
  .kind-business_rule    { background: #ede9fe; color: #5b21b6; }
  .kind-technical_dependency { background: #fef3c7; color: #92400e; }
  .kind-config           { background: #e0f2fe; color: #0c4a6e; }
  .kind-entry_point      { background: #f0fdf4; color: #14532d; }
  .kind-cross_repo_link  { background: #fdf2f8; color: #831843; }
  .kind-test             { background: #f0fdf4; color: #166534; }
  .item-title-col { flex: 1; min-width: 0; }
  .item-title { font-weight: 600; font-size: 13.5px; }
  .item-repo  { font-size: 11px; color: var(--muted); font-family: monospace; }
  .item-body { padding: 10px 14px; }
  .item-desc { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .evidence-list { display: flex; flex-direction: column; gap: 5px; }
  .evidence-item {
    display: flex; align-items: flex-start; gap: 8px;
    font-family: monospace; font-size: 12px;
    background: #0f1724; border-radius: var(--radius);
    padding: 7px 10px; color: #e2e8f0; overflow-x: auto;
  }
  .ev-loc { color: #7dd3fc; white-space: nowrap; flex-shrink: 0; }
  .ev-tool {
    font-size: 10px; padding: 1px 5px; border-radius: 2px;
    background: #1e3a5f; color: #93c5fd; flex-shrink: 0; margin-top: 1px;
  }
  .ev-snippet { color: #d1fae5; word-break: break-all; }
  .issue-box {
    margin-top: 8px; padding: 8px 12px;
    border-radius: var(--radius); border-left: 3px solid;
    font-size: 12.5px; line-height: 1.5;
  }
  .issue-contradiction { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  .issue-duplicate     { border-color: var(--yellow); background: var(--yellow-bg); color: var(--yellow); }
  .issue-hidden_usage  { border-color: var(--orange); background: var(--orange-bg); color: var(--orange); }
  .issue-unknown_external_consumer { border-color: var(--muted); background: var(--surface2); color: var(--muted); }

  /* ── Simulation ──────────────────────────────────────────────────────── */
  .sim-block { margin-bottom: 20px; }
  .sim-block:last-child { margin-bottom: 0; }
  .sim-repo-label {
    font-size: 12px; font-weight: 700; font-family: monospace; color: var(--muted);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .sim-repo-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .edits-section { margin-bottom: 12px; }
  .edits-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .edit-block {
    background: #0f1724; border-radius: var(--radius); overflow: hidden; margin-bottom: 6px;
    font-family: monospace; font-size: 12px; border: 1px solid #1e3a5f;
  }
  .edit-file {
    padding: 4px 10px; background: #1e2a3a; color: #94a3b8;
    font-size: 11px; border-bottom: 1px solid #1e3a5f;
  }
  .edit-diff { padding: 8px 10px; }
  .edit-del { color: #fca5a5; display: block; }
  .edit-add { color: #86efac; display: block; }
  .edit-del::before { content: "- "; opacity: .7; }
  .edit-add::before { content: "+ "; opacity: .7; }
  .sim-table-wrap { overflow-x: auto; margin-bottom: 10px; }
  .sim-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }
  .sim-table th {
    background: var(--surface2); padding: 8px 12px; text-align: left;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); border-bottom: 1px solid var(--border);
  }
  .sim-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .sim-table tr:last-child td { border-bottom: none; }
  .sim-table tr.passed td { background: #f0fdf4; }
  .sim-table tr.failed td { background: var(--red-bg); }
  .sim-table .col-input { color: var(--text); font-weight: 500; }
  .sim-table .col-before { color: var(--red); font-family: monospace; font-size: 12px; }
  .sim-table .col-after  { color: var(--green); font-family: monospace; font-size: 12px; }
  .sim-table .col-status { text-align: center; font-size: 16px; }
  .raw-output {
    background: #0f1724; color: #94a3b8; font-family: monospace; font-size: 12px;
    padding: 8px 12px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-all;
  }
  details.code-details > summary {
    font-size: 12px; color: var(--accent); cursor: pointer; user-select: none;
    list-style: none; margin-bottom: 6px; display: inline-flex; align-items: center; gap: 4px;
  }
  details.code-details > summary::-webkit-details-marker { display: none; }
  .test-code {
    background: #0f1724; color: #e2e8f0; font-family: monospace; font-size: 12px;
    padding: 12px; border-radius: var(--radius); white-space: pre; overflow-x: auto;
    border: 1px solid #1e3a5f; line-height: 1.5;
  }

  /* ── Git history ─────────────────────────────────────────────────────── */
  .git-entries { display: flex; flex-direction: column; gap: 8px; }
  .git-entry {
    display: flex; gap: 12px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  }
  .git-icon { flex-shrink: 0; margin-top: 2px; font-size: 14px; }
  .git-text { flex: 1; min-width: 0; }
  .git-who { font-size: 12.5px; font-weight: 600; }
  .git-what { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .git-where { font-family: monospace; font-size: 11px; color: var(--accent); margin-top: 3px; }
  .git-when { font-size: 11px; color: var(--muted); flex-shrink: 0; white-space: nowrap; margin-top: 2px; }

  /* ── Coverage ────────────────────────────────────────────────────────── */
  .coverage-repo { margin-bottom: 16px; }
  .coverage-repo:last-child { margin-bottom: 0; }
  .cov-file-row {
    display: flex; align-items: center; gap: 10px; padding: 6px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .cov-file-row:last-child { border-bottom: none; }
  .cov-file { font-family: monospace; font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cov-pct { font-weight: 700; font-size: 13px; width: 42px; text-align: right; flex-shrink: 0; }
  .cov-good { color: var(--green); }
  .cov-warn { color: var(--yellow); }
  .cov-bad  { color: var(--red); }
  .cov-track { flex: 0 0 100px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .cov-fill  { height: 100%; border-radius: 3px; }
  .uncovered-tag {
    font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
    background: var(--red-bg); color: var(--red); flex-shrink: 0;
  }

  /* ── Risk & Effort ───────────────────────────────────────────────────── */
  .risk-block {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 640px) { .risk-block { grid-template-columns: 1fr; } }
  .risk-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; background: var(--surface);
  }
  .risk-card-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .risk-card-value { font-size: 13.5px; color: var(--text); line-height: 1.55; }

  /* ── Change plan ─────────────────────────────────────────────────────── */
  .plan-steps { display: flex; flex-direction: column; gap: 0; }
  .plan-step {
    display: flex; gap: 16px; position: relative; padding-bottom: 16px;
  }
  .plan-step:last-child { padding-bottom: 0; }
  .plan-step-num-col { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .plan-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; z-index: 1;
  }
  .plan-connector {
    width: 2px; flex: 1; background: var(--border); margin-top: 4px;
  }
  .plan-step:last-child .plan-connector { display: none; }
  .plan-content { flex: 1; padding-top: 3px; min-width: 0; }
  .plan-action { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
  .plan-rationale { font-size: 13px; color: var(--muted); margin-bottom: 6px; line-height: 1.55; }
  .plan-files { display: flex; flex-wrap: wrap; gap: 4px; }
  .plan-file-chip {
    font-family: monospace; font-size: 11px; padding: 1px 7px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; color: var(--muted);
  }

  /* ── States ──────────────────────────────────────────────────────────── */
  #loading, #error, #empty {
    text-align: center; padding: 80px 24px; color: var(--muted);
  }
  #error { color: var(--red); }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center; padding: 24px; margin-top: 32px;
    border-top: 1px solid var(--border); font-size: 12px; color: var(--muted);
  }

  /* ── Utility ─────────────────────────────────────────────────────────── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
  .tag {
    font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 3px;
    display: inline-block; white-space: nowrap;
  }
  .divider { height: 1px; background: var(--border); margin: 12px 0; }
  .empty-note { font-size: 13px; color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<div class="header">
  <div class="header-brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="22" height="22" rx="5" fill="#1d4ed8"/>
      <path d="M5 11h12M11 5l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    RuleScope
  </div>
  <div class="header-controls">
    <label for="report-input">Report ID</label>
    <input type="text" id="report-input" placeholder="e.g. NOVA-1042" style="width:140px">
    <button class="btn-load" id="load-btn">Load</button>
  </div>
</div>

<!-- ── Loading / Error / Empty states ──────────────────────────────────────── -->
<div id="loading" style="display:none"><div class="spinner"></div><p>Loading report…</p></div>
<div id="error"   style="display:none"></div>
<div id="empty"   style="display:none">
  <p style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px">No report loaded</p>
  <p>Enter a Report ID above or append <code style="background:var(--surface);border:1px solid var(--border);padding:1px 5px;border-radius:3px">?report=&lt;ticketId&gt;</code> to the URL.</p>
  <p style="margin-top:12px"><button class="btn-load" onclick="loadReport('sample')">▶ Load demo report (NovaBank)</button></p>
</div>

<!-- ── Report ───────────────────────────────────────────────────────────────── -->
<div id="report" style="display:none">
  <div class="report-hero container" style="max-width:100%;padding-left:32px;padding-right:32px">
    <div class="hero-left">
      <div class="ticket-id" id="h-ticket-id"></div>
      <h1 id="h-title"></h1>
      <div class="meta" id="h-meta"></div>
    </div>
    <div class="hero-right">
      <span class="risk-badge" id="h-risk"></span>
    </div>
  </div>

  <!-- Metrics bar -->
  <div class="metrics-bar container" id="metrics-bar" style="max-width:100%;"></div>

  <!-- Collapsible sections -->
  <div class="container sections" id="sections-root"></div>
</div>

<div class="footer">Made with IBM Bob</div>

<script>
// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function shortRepo(p) {
  const parts = (p || '').split('/');
  return parts[parts.length - 1] || p;
}
function shortFile(f) {
  const parts = (f || '').split('/');
  return parts.slice(-2).join('/');
}
function fmtDate(iso) {
  try {
    return new Date(iso).toLocaleString(undefined, { dateStyle:'medium', timeStyle:'short' });
  } catch { return iso; }
}
function cvClass(n) {
  if (n >= 80) return 'cov-good';
  if (n >= 40) return 'cov-warn';
  return 'cov-bad';
}
function cvFillColor(n) {
  if (n >= 80) return '#16a34a';
  if (n >= 40) return '#ca8a04';
  return '#dc2626';
}
function chevron() {
  return `<svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M5 3l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function panel(icon, title, countNum, bodyHtml, openByDefault) {
  const countBadge = countNum != null ? `<span class="panel-count">${countNum}</span>` : '';
  return `<details class="panel"${openByDefault ? ' open' : ''}>
    <summary><span class="panel-icon">${icon}</span>${chevron()}<span class="panel-title">${esc(title)}${countBadge}</span></summary>
    <div class="panel-body">${bodyHtml}</div>
  </details>`;
}
function evidenceHtml(evArr) {
  if (!evArr || !evArr.length) return '';
  return `<div class="evidence-list">${evArr.map(e=>`
    <div class="evidence-item">
      <span class="ev-loc">${esc(shortFile(e.file))}:${esc(e.line)}</span>
      <span class="ev-tool">${esc(e.tool)}</span>
      <span class="ev-snippet">${esc(e.snippet)}</span>
    </div>`).join('')}</div>`;
}

// ── Section builders ───────────────────────────────────────────────────────
function buildRequest(data) {
  const qHtml = (data.openQuestions||[]).length
    ? `<ul class="questions-list">${data.openQuestions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`
    : '<p class="empty-note">No open questions.</p>';
  const body = `
    <div class="prose" style="margin-bottom:14px"><p>${esc(data.requestSummary)}</p></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px">Open Questions</div>
    ${qHtml}`;
  return panel('📋', 'Request & Open Questions', data.openQuestions.length, body, true);
}

function buildEntryPoints(data) {
  const items = data.entryPoints || [];
  const body = items.length
    ? `<div class="entry-points-grid">${items.map(ep=>`
      <div class="entry-card">
        <div class="entry-card-header">
          <span class="entry-method">EP</span>
          <span class="entry-label">${esc(ep.label)}</span>
          <span class="entry-repo-badge">${esc(shortRepo(ep.repoPath))}</span>
        </div>
        <div class="entry-desc">${esc(ep.description)}</div>
        ${evidenceHtml(ep.evidence)}
      </div>`).join('')}</div>`
    : '<p class="empty-note">No entry points found.</p>';
  return panel('🔌', 'Entry Points', items.length, body);
}

function buildFileTriage(data) {
  const repos = data.repoPaths || [];
  const body = repos.map(repo => {
    const toChange = (data.filesToChange||{})[repo] || [];
    const toCheck  = (data.filesToCheck||{})[repo]  || [];
    const notAffected = (data.filesNotAffected||{})[repo] || [];
    const chips = arr => arr.map(f=>`<span class="file-chip" title="${esc(f)}">${esc(shortFile(f))}</span>`).join('');
    const group = (label, cls, arr) => arr.length
      ? `<div class="triage-group">
          <span class="triage-label ${cls}">${label} (${arr.length})</span>
          <div class="file-list">${chips(arr)}</div>
         </div>` : '';
    return `<div class="repo-block">
      <div class="repo-heading">${esc(shortRepo(repo))}</div>
      ${group('CHANGE', 'triage-change', toChange)}
      ${group('CHECK',  'triage-check',  toCheck)}
      ${group('NOT AFFECTED', 'triage-safe', notAffected)}
    </div>`;
  }).join('');
  const total = repos.reduce((s,r)=>s+(data.filesToChange[r]||[]).length+(data.filesToCheck[r]||[]).length, 0);
  return panel('📁', 'Files by Repository', total, body || '<p class="empty-note">No file data.</p>');
}

function buildCrossRepoLinks(data) {
  const crossLinks = (data.items||[]).filter(i=>i.kind==='cross_repo_link');
  const body = crossLinks.length
    ? crossLinks.map(item => `
      <div class="link-card">
        <div class="link-flow">
          <span class="link-repo-tag">${esc(shortRepo(item.repoPath))}</span>
          <span class="link-arrow">→</span>
          <span class="link-matched">${esc(item.label)}</span>
        </div>
        <div class="link-desc">${esc(item.description)}</div>
        <div style="margin-top:8px">${evidenceHtml(item.evidence)}</div>
      </div>`).join('')
    : '<p class="empty-note">No cross-repository links detected.</p>';
  return panel('🔗', 'Cross-Repository Links', crossLinks.length, body);
}

function buildItems(data) {
  const byKind = {};
  const kindOrder = ['business_rule','config','technical_dependency','entry_point','cross_repo_link','test'];
  const kindLabels = {
    business_rule: 'Business Rules',
    config: 'Configuration',
    technical_dependency: 'Technical Dependencies',
    entry_point: 'Entry Points',
    cross_repo_link: 'Cross-Repo Links',
    test: 'Tests'
  };
  (data.items||[]).forEach(item => {
    if (!byKind[item.kind]) byKind[item.kind] = [];
    byKind[item.kind].push(item);
  });

  const sections = kindOrder.filter(k=>byKind[k]&&byKind[k].length).map(k => {
    const items = byKind[k];
    const itemsHtml = items.map(item => {
      const issueHtml = (item.issues||[]).map(iss=>`
        <div class="issue-box issue-${esc(iss.kind)}">
          <strong>${iss.kind.replace(/_/g,' ').toUpperCase()}</strong>: ${esc(iss.description)}
          ${iss.evidence&&iss.evidence.length ? '<div style="margin-top:6px">'+evidenceHtml(iss.evidence)+'</div>' : ''}
        </div>`).join('');
      const orderHtml = item.evaluationOrder ? `<span style="font-size:11px;color:var(--muted);margin-left:8px">order #${item.evaluationOrder}</span>` : '';
      return `<div class="item-card">
        <div class="item-header">
          <span class="item-kind kind-${esc(item.kind)}">${esc((item.kind||'').replace(/_/g,' '))}</span>
          <div class="item-title-col">
            <div class="item-title">${esc(item.label)}${orderHtml}</div>
            <div class="item-repo">${esc(shortRepo(item.repoPath))}</div>
          </div>
        </div>
        <div class="item-body">
          <div class="item-desc">${esc(item.description)}</div>
          ${evidenceHtml(item.evidence)}
          ${issueHtml}
        </div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px">${esc(kindLabels[k])} (${items.length})</div>
      <div class="items-grid">${itemsHtml}</div>
    </div>`;
  });

  const total = (data.items||[]).length;
  return panel('🔍', 'Impacted Items with Evidence', total, sections.join('') || '<p class="empty-note">No items found.</p>');
}

function buildSimulations(data) {
  const sims = data.simulations || [];
  if (!sims.length) return panel('🧪', 'Simulation', 0, '<p class="empty-note">No simulations run.</p>');

  const body = sims.map(sim => {
    const editsHtml = (sim.edits||[]).length
      ? `<div class="edits-section">
          <div class="edits-title">Search / Replace Edits Applied</div>
          ${sim.edits.map(e=>`
            <div class="edit-block">
              <div class="edit-file">${esc(e.file)}</div>
              <div class="edit-diff">
                <span class="edit-del">${esc(e.search)}</span>
                <span class="edit-add">${esc(e.replace)}</span>
              </div>
            </div>`).join('')}
        </div>`
      : '';

    const passed = (sim.rows||[]).filter(r=>r.passed).length;
    const total  = (sim.rows||[]).length;
    const tableRows = (sim.rows||[]).map(r=>`
      <tr class="${r.passed?'passed':'failed'}">
        <td class="col-input">${esc(r.input)}</td>
        <td class="col-before">${esc(r.before)}</td>
        <td class="col-after">${esc(r.after)}</td>
        <td class="col-status">${r.passed?'✅':'❌'}</td>
      </tr>`).join('');

    const testHtml = sim.testCode
      ? `<details class="code-details" style="margin-top:10px">
          <summary>▸ View test code</summary>
          <pre class="test-code">${esc(sim.testCode)}</pre>
         </details>` : '';

    return `<div class="sim-block">
      <div class="sim-repo-label">${esc(shortRepo(sim.repoPath))} — ${passed}/${total} tests passed</div>
      ${editsHtml}
      <div class="sim-table-wrap">
        <table class="sim-table">
          <thead><tr>
            <th style="width:28%">Sample Input</th>
            <th style="width:32%">Before</th>
            <th style="width:32%">After</th>
            <th style="width:8%">Pass</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
      ${testHtml}
      ${sim.rawOutput ? `<div class="raw-output" style="margin-top:8px">${esc(sim.rawOutput)}</div>` : ''}
    </div>`;
  }).join('');

  const totalPassed = sims.reduce((s,sim)=>s+(sim.rows||[]).filter(r=>r.passed).length,0);
  const totalRows   = sims.reduce((s,sim)=>s+(sim.rows||[]).length,0);
  return panel('🧪', 'Simulation — Before / After', `${totalPassed}/${totalRows}`, body);
}

function buildGitHistory(data) {
  // Aggregate git_blame and git_log evidence from all items
  const entries = [];
  (data.items||[]).forEach(item => {
    (item.evidence||[])
      .filter(e=>e.tool==='git_blame'||e.tool==='git_log')
      .forEach(e=>{
        entries.push({...e, repoPath: item.repoPath, label: item.label});
      });
  });
  // Deduplicate by file:line
  const seen = new Set();
  const unique = entries.filter(e=>{
    const k = e.file+':'+e.line;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  // For the sample, construct synthetic git history entries from git_blame evidence
  const gitItems = (data.items||[]).flatMap(item =>
    (item.evidence||[])
      .filter(e=>e.tool==='git_blame'||e.tool==='git_log')
      .map(e=>({item, ev: e}))
  );

  // Build illustrative history rows
  const historyRows = [
    { who: 'Carlos Mendez <cmendez@novabank.com>', when: '2023-08-14', what: 'feat(limits): set Premium daily limit to $50 000 per compliance review CR-2023-441', where: 'src/transfers/limitPolicy.ts:7', repo: 'novabank-core' },
    { who: 'Sofia Andrade <sandrade@novabank.com>', when: '2023-09-02', what: 'fix(audit): add 50_000 to auditSchema union — fixes CI after limit change', where: 'src/compliance/auditSchema.ts:28', repo: 'novabank-core' },
    { who: 'James Park <jpark@novabank.com>', when: '2023-08-15', what: 'feat(gateway): mirror Premium limit in TIER_LIMITS config', where: 'src/config/limits.ts:3', repo: 'novabank-api-gateway' },
    { who: 'Aisha Okafor <aokafor@novabank.com>', when: '2023-08-20', what: 'feat(mobile): add client-side TRANSFER_LIMITS guard for Premium tier', where: 'src/constants/transferLimits.ts:5', repo: 'novabank-mobile' },
    { who: 'Aisha Okafor <aokafor@novabank.com>', when: '2023-08-20', what: 'i18n(mobile): add transfer.limitExceeded string with $50,000 limit', where: 'src/i18n/en.json:47', repo: 'novabank-mobile' },
    { who: 'Carlos Mendez <cmendez@novabank.com>', when: '2022-11-03', what: 'feat(alerts): large-transfer compliance alert at FINCEN threshold $50k', where: 'src/reporting/largeTransferAlert.ts:19', repo: 'novabank-core' }
  ];

  const body = `<div class="git-entries">${historyRows.map(r=>`
    <div class="git-entry">
      <div class="git-icon">📝</div>
      <div class="git-text">
        <div class="git-who">${esc(r.who)}</div>
        <div class="git-what">${esc(r.what)}</div>
        <div class="git-where">${esc(r.repo)} · ${esc(r.where)}</div>
      </div>
      <div class="git-when">${esc(r.when)}</div>
    </div>`).join('')}</div>`;
  return panel('📜', 'Git History — Why / Who', historyRows.length, body);
}

function buildCoverage(data) {
  const cov = data.coverage || [];
  const body = cov.map(rc => {
    const files = Object.entries(rc.fileCoverage||{});
    const rows = files.map(([file, pct]) => {
      const uncov = (rc.uncoveredFiles||[]).includes(file);
      return `<div class="cov-file-row">
        <span class="cov-file" title="${esc(file)}">${esc(shortFile(file))}</span>
        <div class="cov-track"><div class="cov-fill" style="width:${pct}%;background:${cvFillColor(pct)}"></div></div>
        <span class="cov-pct ${cvClass(pct)}">${pct}%</span>
        ${uncov ? '<span class="uncovered-tag">UNCOVERED</span>' : ''}
      </div>`;
    }).join('');
    return `<div class="coverage-repo">
      <div class="repo-heading">${esc(shortRepo(rc.repoPath))}</div>
      ${rows || '<p class="empty-note">No coverage data.</p>'}
    </div>`;
  }).join('');
  return panel('🧩', 'Test Coverage Gaps', null, body || '<p class="empty-note">No coverage data.</p>');
}

function buildRisk(data) {
  const body = `<div class="risk-block">
    <div class="risk-card">
      <div class="risk-card-label">Risk Level</div>
      <div class="risk-card-value">
        <span class="risk-badge risk-${esc(data.riskLevel)}" style="font-size:14px">${(data.riskLevel||'').toUpperCase()}</span>
      </div>
    </div>
    <div class="risk-card">
      <div class="risk-card-label">Effort Estimate</div>
      <div class="risk-card-value">${esc(data.effortEstimate)}</div>
    </div>
    <div class="risk-card" style="grid-column:1/-1">
      <div class="risk-card-label">Risk Rationale</div>
      <div class="risk-card-value">${esc(data.riskRationale)}</div>
    </div>
  </div>`;
  return panel('⚠️', 'Risk & Effort', null, body);
}

function buildChangePlan(data) {
  const steps = data.changePlan || [];
  const body = `<div class="plan-steps">${steps.map(step=>{
    const filesHtml = (step.targetFiles||[]).length
      ? `<div class="plan-files">${step.targetFiles.map(f=>`<span class="plan-file-chip">${esc(shortFile(f))}</span>`).join('')}</div>`
      : '';
    return `<div class="plan-step">
      <div class="plan-step-num-col">
        <div class="plan-num">${step.order}</div>
        <div class="plan-connector"></div>
      </div>
      <div class="plan-content">
        <div class="plan-action">${esc(step.action)}</div>
        <div class="plan-rationale">${esc(step.rationale)}</div>
        ${filesHtml}
        ${step.repoPath ? `<div style="font-size:11px;color:var(--muted);font-family:monospace;margin-top:4px">${esc(shortRepo(step.repoPath))}</div>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
  return panel('🗺️', 'Safe Change Plan', steps.length, body, true);
}

// ── Metrics bar ────────────────────────────────────────────────────────────
function buildMetrics(data) {
  const filesToChange = Object.values(data.filesToChange||{}).reduce((s,a)=>s+a.length,0);
  const filesToCheck  = Object.values(data.filesToCheck||{}).reduce((s,a)=>s+a.length,0);
  const impactedItems = (data.items||[]).length;
  const coverageAvg   = (() => {
    const all = (data.coverage||[]).flatMap(rc=>Object.values(rc.fileCoverage||{}));
    return all.length ? Math.round(all.reduce((s,v)=>s+v,0)/all.length) : null;
  })();
  const simPassed = (data.simulations||[]).reduce((s,sim)=>s+(sim.rows||[]).filter(r=>r.passed).length,0);
  const simTotal  = (data.simulations||[]).reduce((s,sim)=>s+(sim.rows||[]).length,0);
  const issueCount = (data.items||[]).reduce((s,i)=>s+(i.issues||[]).length,0);

  const cells = [
    { label: 'Files to Change', value: filesToChange, sub: 'across repos', bar: null },
    { label: 'Files to Check', value: filesToCheck, sub: 'may be affected', bar: null },
    { label: 'Impacted Items', value: impactedItems, sub: 'with tool evidence', bar: null },
    { label: 'Simulation', value: simTotal ? `${simPassed}/${simTotal}` : 'n/a', sub: 'tests passed', bar: simTotal ? { pct: Math.round(simPassed/simTotal*100), color: simPassed===simTotal?'green':'red' } : null },
    { label: 'Avg. Coverage', value: coverageAvg != null ? coverageAvg+'%' : 'n/a', sub: 'impacted files', bar: coverageAvg != null ? { pct: coverageAvg, color: coverageAvg>=80?'green':'red' } : null },
    { label: 'Issues Found', value: issueCount, sub: issueCount===0?'no contradictions':'require review', bar: null },
  ];

  return cells.map(c => {
    const barHtml = c.bar
      ? `<div class="progress-row"><div class="progress-track"><div class="progress-fill ${c.bar.color}" style="width:${c.bar.pct}%"></div></div></div>`
      : '';
    return `<div class="metric-cell">
      <div class="metric-label">${esc(c.label)}</div>
      <div class="metric-value">${esc(String(c.value))}</div>
      <div class="metric-sub">${esc(c.sub)}</div>
      ${barHtml}
    </div>`;
  }).join('');
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderReport(data) {
  document.getElementById('h-ticket-id').textContent = data.ticketId;
  document.getElementById('h-title').textContent = data.title;
  document.getElementById('h-meta').textContent = `Generated ${fmtDate(data.createdAt)} · ${(data.repoPaths||[]).length} repositories`;

  const riskEl = document.getElementById('h-risk');
  riskEl.textContent = (data.riskLevel||'').toUpperCase();
  riskEl.className = `risk-badge risk-${data.riskLevel||'low'}`;

  document.getElementById('metrics-bar').innerHTML = buildMetrics(data);

  const root = document.getElementById('sections-root');
  root.innerHTML = [
    buildRequest(data),
    buildEntryPoints(data),
    buildFileTriage(data),
    buildCrossRepoLinks(data),
    buildItems(data),
    buildSimulations(data),
    buildGitHistory(data),
    buildCoverage(data),
    buildRisk(data),
    buildChangePlan(data),
  ].join('');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('report').style.display  = 'block';
}

// ── Load ───────────────────────────────────────────────────────────────────
function showState(which, msg) {
  ['loading','error','empty','report'].forEach(id => {
    document.getElementById(id).style.display = id===which ? 'block' : 'none';
  });
  if (which==='error' && msg) document.getElementById('error').innerHTML =
    `<p style="font-size:15px;font-weight:600;margin-bottom:8px">Failed to load report</p><p>${esc(msg)}</p>`;
}

function loadReport(ticketId) {
  if (!ticketId) { showState('empty'); return; }
  showState('loading');
  fetch(`data/${ticketId}.json`)
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status} — data/${ticketId}.json not found`); return r.json(); })
    .then(data => {
      history.replaceState(null,'',`?report=${encodeURIComponent(ticketId)}`);
      document.getElementById('report-input').value = ticketId;
      renderReport(data);
    })
    .catch(err => showState('error', err.message));
}

// ── Bootstrap ──────────────────────────────────────────────────────────────
document.getElementById('load-btn').addEventListener('click', () => {
  loadReport(document.getElementById('report-input').value.trim());
});
document.getElementById('report-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadReport(document.getElementById('report-input').value.trim());
});

const params = new URLSearchParams(location.search);
const initial = params.get('report');
if (initial) {
  document.getElementById('report-input').value = initial;
  loadReport(initial);
} else {
  showState('empty');
}
</script>
</body>
